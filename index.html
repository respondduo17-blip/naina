<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Valentine's Day Naina 💕</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom font classes */
        .font-script { font-family: 'Great Vibes', cursive; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }

        body { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; margin: 0; overflow-x: hidden; }

        /* Animations */
        @keyframes float-up {
            0% { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0); }
            10% { opacity: 1; transform: translateY(90vh) rotate(20deg) scale(1); }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10vh) rotate(360deg) scale(0.5); }
        }
        .animate-float-up { animation: float-up linear infinite; }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            10% { transform: scale(1.1); }
            30% { transform: scale(1.15); }
        }
        .animate-heartbeat { animation: heartbeat 1.5s ease-in-out infinite; }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fade-in-up 1s ease-out forwards; }

        .text-gradient {
            background: linear-gradient(135deg, #FF6B8A 0%, #FF8E53 50%, #FFD26F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Component: Floating Hearts ---
        const FloatingHearts = () => {
            const hearts = Array.from({ length: 20 });
            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                    {hearts.map((_, i) => (
                        <div 
                            key={i}
                            className="absolute text-rose-400 animate-float-up"
                            style={{
                                left: `${Math.random() * 100}%`,
                                animationDuration: `${6 + Math.random() * 4}s`,
                                animationDelay: `${Math.random() * 5}s`,
                                fontSize: `${15 + Math.random() * 20}px`
                            }}
                        >
                            ❤️
                        </div>
                    ))}
                </div>
            );
        };

        // --- Component: Entrance Screen ---
        const EntranceScreen = ({ onEnter, isTransitioning }) => (
            <div className={`fixed inset-0 flex flex-col items-center justify-center bg-pink-50 transition-opacity duration-1000 ${isTransitioning ? 'opacity-0' : 'opacity-100'}`}>
                <div className="text-center p-8 glass rounded-3xl shadow-2xl animate-heartbeat">
                    <h1 className="font-script text-6xl text-rose-500 mb-6">For Naina...</h1>
                    <button 
                        onClick={onEnter}
                        className="px-8 py-3 bg-rose-500 text-white rounded-full font-semibold hover:bg-rose-600 transition-all shadow-lg"
                    >
                        Open with Love ❤️
                    </button>
                </div>
            </div>
        );

        // --- Main App Component ---
        function App() {
            const [entered, setEntered] = useState(false);
            const [isTransitioning, setIsTransitioning] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                audioRef.current = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
                audioRef.current.loop = true;
                audioRef.current.volume = 0.3;
            }, []);

            const handleEnter = () => {
                setIsTransitioning(true);
                audioRef.current?.play().catch(() => {});
                setTimeout(() => setEntered(true), 1000);
            };

            if (!entered) {
                return <EntranceScreen onEnter={handleEnter} isTransitioning={isTransitioning} />;
            }

            return (
                <div className="min-h-screen bg-gradient-to-b from-pink-100 via-rose-50 to-pink-100 relative">
                    <FloatingHearts />
                    
                    <main className="relative z-10 flex flex-col items-center py-20 px-4">
                        {/* Hero Section */}
                        <div className="text-center mb-16 animate-fade-in-up">
                            <h1 className="font-script text-7xl md:text-9xl text-rose-600 mb-4">Happy Valentine's Day</h1>
                            <p className="font-playfair text-2xl md:text-4xl text-rose-400 italic">My Dearest Naina</p>
                        </div>

                        {/* Love Message Section */}
                        <div className="max-w-2xl glass p-10 rounded-3xl shadow-soft text-center mb-20">
                            <p className="font-poppins text-gray-700 leading-relaxed text-lg italic">
                                "Every moment with you feels like a beautiful dream. Your smile brightens my darkest days, and your love is the greatest gift I've ever received. Today is just another day to remind you how much you mean to me."
                            </p>
                            <div className="mt-6 text-rose-500 text-3xl">❤️❤️❤️</div>
                        </div>

                        {/* Simple Gallery Placeholder */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl w-full">
                            <div className="aspect-square bg-rose-200 rounded-2xl flex items-center justify-center text-rose-400 font-script text-3xl">Beautiful Memories</div>
                            <div className="aspect-square bg-rose-200 rounded-2xl flex items-center justify-center text-rose-400 font-script text-3xl">Together Forever</div>
                        </div>

                        <footer className="mt-20 text-rose-400 font-playfair italic">
                            With all my love, always.
                        </footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
